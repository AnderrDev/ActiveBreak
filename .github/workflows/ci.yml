# Integración y despliegue continuo (CI/CD) del backend de ActiveBreak.
#
# Se ejecuta en cada push a main:
#   1. build-backend  (máquina Ubuntu de GitHub): instala, compila y publica la imagen en Docker Hub.
#   2. deploy-backend (tu equipo como runner self-hosted): descarga la imagen nueva y reinicia el contenedor.
#
# Requisitos en GitHub (Settings -> Secrets and variables -> Actions):
#   Secrets:   DOCKER_USERNAME (usuario de Docker Hub) y DOCKER_TOKEN (access token de Docker Hub)
#   Variables: DEPLOY_DIR (carpeta del proyecto en el equipo del runner, donde están docker-compose.yml y .env)
name: CI/CD Backend ActiveBreak

on:
  push:
    branches:
      - main

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar TypeScript
        run: npm run build

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Construir imagen Docker
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/activebreak-backend:latest .

      - name: Publicar imagen en Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/activebreak-backend:latest

  deploy-backend:
    needs: build-backend
    runs-on: self-hosted
    steps:
      - name: Actualizar contenedor backend
        working-directory: ${{ vars.DEPLOY_DIR }}
        run: |
          docker compose pull backend
          docker compose up -d backend
