# Ambiente local de ActiveBreak: API (con recarga automática) + PostgreSQL.
# Los valores se leen del .env de la raíz; si faltan se usan los valores por defecto.
#   docker compose up --build      -> levanta todo
#   docker compose down            -> detiene (los datos se conservan)
#   docker compose down -v         -> detiene y borra la base de datos

name: activebreak

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-activebreak}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-activebreak}
      POSTGRES_DB: ${DB_NAME:-activebreak}
    ports:
      # Puerto del host distinto a 5432 para no chocar con un PostgreSQL local.
      # Solo en 127.0.0.1: la BD de desarrollo (con contraseña por defecto) no queda expuesta en la red.
      - "127.0.0.1:${DB_PORT_HOST:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      # Dentro de la red de Docker la BD se llama "db" y escucha en 5432
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-activebreak}
      DB_PASSWORD: ${DB_PASSWORD:-activebreak}
      DB_NAME: ${DB_NAME:-activebreak}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatorio (mínimo 32 caracteres), defínelo en .env}
    ports:
      - "${API_PORT_HOST:-3000}:3000"
    volumes:
      # Monta el código para que nodemon recargue al guardar
      - ./src:/app/src

volumes:
  db-data:
